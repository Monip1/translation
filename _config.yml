title: CSE 190 Study
description: The website for coding a feature with AI study.
remote_theme: just-the-docs/just-the-docs
color_scheme: light

domain: monip1.github.io/translation
url: https://monip1.github.io/translation

  #logo: "/assets/new_logo.png"
  #favicon_ico: "/assets/favicon/favicon.ico"

math: katex

# TODO: update these once all the links are obtained
aux_links:
aux_links_new_tab: true

footer_content: 'University of California San Diego. Built with <a href="https://github.com/just-the-docs/just-the-docs">Just the Docs</a>.'
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

callouts:
  note:
    color: blue
    title: note
  warning:
    color: red
    title: warning
  important:
    color: green
    title: important
  checkoff:
    color: green
    title: 📋 Team check in!
  owntime:
    color: grey-dk
    title: 🚀 In your own time
  exercise:
    color: purple
    title: 💪 Exercise
  midterm:
    color: red
    title: Midterm Exam

plugins:
  - jekyll-remote-theme

mermaid:
  version: 11.6.0

# Enable table of contents
toc:
  enabled: true
  h_min: 2
  h_max: 3
